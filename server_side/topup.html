<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Up Balance | Time System</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    :root {
      --bg-color: #08090c;
      --card-bg: rgba(10, 10, 14, 0.65);
      --card-border: rgba(255, 55, 55, 0.42);
      --accent: #ff2323;
      --accent-hover: #ff4d4d;
      --text-main: #ffffff;
      --text-muted: rgba(255, 188, 188, 0.85);
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: radial-gradient(circle at 20% 20%, rgba(255, 52, 52, 0.08), transparent 38%), radial-gradient(circle at 80% 75%, rgba(255, 20, 20, 0.05), transparent 40%);
    }

    h1,
    h2,
    h3,
    h4,
    .brand-text {
      font-family: 'Orbitron', sans-serif;
    }

    .sidebar {
      background: linear-gradient(165deg, rgba(8, 8, 12, 0.97), rgba(2, 2, 4, 0.95));
      border-right: 1px solid var(--card-border);
      min-height: 100vh;
      box-shadow: 0 0 15px rgba(255, 30, 30, 0.1);
    }

    .sidebar-link {
      color: var(--text-muted);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: all 0.3s ease;
      border-radius: 8px;
      margin-bottom: 5px;
    }

    .sidebar-link:hover,
    .sidebar-link.active {
      background: rgba(255, 35, 35, 0.15);
      color: #fff;
      border-left: 4px solid var(--accent);
    }

    .brand-text {
      color: rgba(255, 170, 170, 0.95);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 1.2rem;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: inset 0 0 0 1px rgba(255, 35, 35, 0.18);
    }

    .topbar {
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-glow {
      background: linear-gradient(90deg, #ff1212, #ff4d4d);
      border: none;
      color: white;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(255, 24, 24, 0.4);
    }

    .btn-glow:hover {
      background: linear-gradient(90deg, #ff4d4d, #ff1212);
      color: white;
      transform: translateY(-2px);
    }

    .form-control,
    .form-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: white;
      padding: 12px;
    }

    .form-control:focus,
    .form-select:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 0 0 0.25rem rgba(255, 35, 35, 0.25);
    }

    .swal2-popup {
      background: #060608 !important;
      color: #fff !important;
      border: 1px solid var(--card-border) !important;
    }

    .swal2-title {
      color: #fff !important;
    }

    .logout-btn {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s;
    }

    .logout-btn:hover {
      color: var(--accent);
    }
  </style>
</head>

<body>

  <div class="container-fluid">
    <div class="row">
      <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
        <div class="text-center mb-5 mt-3">
          <i class="bi bi-cpu text-danger fs-1"></i>
          <h5 class="brand-text mt-2">Server Portal</h5>
        </div>
        <div class="position-sticky">
          <ul class="nav flex-column">
            <li class="nav-item"><a class="sidebar-link" href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i>
                Dashboard</a></li>
            <li class="nav-item"><a class="sidebar-link" href="clients.html"><i class="bi bi-people-fill"></i> Users &
                Cards</a></li>
            <li class="nav-item"><a class="sidebar-link active" href="topup.html"><i class="bi bi-wallet-fill"></i> Top
                Up</a></li>
            <li class="nav-item"><a class="sidebar-link" href="logs.html"><i class="bi bi-journal-text"></i>
                Transactions</a></li>
          </ul>
          <div class="mt-5 text-center px-3">
            <a href="server_log-in.html" class="logout-btn w-100 d-block py-2 border border-danger rounded">
              <i class="bi bi-box-arrow-right"></i> Disconnect
            </a>
          </div>
        </div>
      </nav>

      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-5">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 topbar">
          <h1 class="h2 text-white m-0">Manual Top-Up</h1>
        </div>

        <div class="row justify-content-center">
          <div class="col-12 col-xl-6 col-lg-8 border-danger">
            <div class="glass-card mt-4">
              <div class="text-center mb-4">
                <i class="bi bi-wallet2 text-danger" style="font-size: 3rem;"></i>
                <h3 class="mt-2">Add Balance</h3>
                <p class="text-white-50">Select a user to add funds to their account.</p>
              </div>

              <form id="topupForm">
                <div class="mb-4">
                  <label class="form-label text-white-50 mb-2">Select User</label>
                  <select class="form-select fs-5" name="user_id" id="userSelect" required>
                    <option value="" disabled selected>-- Loading Users... --</option>
                  </select>
                </div>

                <div class="mb-5">
                  <label class="form-label text-white-50 mb-2">Amount (₱)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-transparent border-danger text-danger fs-4">₱</span>
                    <input type="number" class="form-control fs-4" name="amount" min="1" step="0.5" required
                      placeholder="0.00">
                  </div>
                </div>

                <div class="d-grid mt-2">
                  <button type="submit" class="btn btn-glow py-3 fs-5"><i class="bi bi-check-circle me-2"></i> Confirm
                    Top-Up</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    $(document).ready(function () {
      // Load users
      fetch('api/admin/users.php')
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            $('#userSelect').html('<option value="" disabled selected>-- Select a User --</option>');
            data.data.forEach(u => {
              $('#userSelect').append(`<option value="${u.id}">${u.name} (Bal: ₱${Number(u.balance).toFixed(2)})</option>`);
            });
          }
        });

      // Submit topup
      $('#topupForm').on('submit', function (e) {
        e.preventDefault();

        const username = $('#userSelect option:selected').text().split(' (')[0];
        const amount = $('input[name="amount"]').val();

        Swal.fire({
          title: 'Confirm Top-Up?',
          html: `Add <b>₱${amount}</b> to <b>${username}</b>?`,
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#ff2323',
          cancelButtonColor: '#343a40',
          confirmButtonText: 'Yes, Top-Up',
          background: '#060608',
          color: '#fff'
        }).then((result) => {
          if (result.isConfirmed) {
            fetch('api/admin/topup.php', { method: 'POST', body: new FormData(this) })
              .then(res => res.json())
              .then(res => {
                if (res.success) {
                  Swal.fire({ icon: 'success', title: 'Top-Up Successful', text: res.message, timer: 1500, showConfirmButton: false });
                  this.reset();
                  $('#userSelect').html('<option value="" disabled selected>-- Loading Users... --</option>');
                  // Reload balances
                  fetch('api/admin/users.php').then(r => r.json()).then(d => {
                    $('#userSelect').html('<option value="" disabled selected>-- Select a User --</option>');
                    d.data.forEach(u => $('#userSelect').append(`<option value="${u.id}">${u.name} (Bal: ₱${Number(u.balance).toFixed(2)})</option>`));
                  });
                } else Swal.fire('Error', res.message, 'error');
              });
          }
        });
      });
    });
  </script>
</body>

</html>
