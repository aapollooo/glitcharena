<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Futuristic Login</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: url('Gaming Background .png') center/cover no-repeat;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .login-container {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(420px, calc(100vw - 32px));
      padding: 44px 34px 38px;
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02)),
        linear-gradient(160deg, rgba(40, 8, 14, 0.84), rgba(14, 6, 8, 0.88));
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 70, 70, 0.35);
      box-shadow: 0 18px 50px rgba(18, 0, 2, 0.62);
      color: white;
      overflow: hidden;
      animation: floatCard 5s ease-in-out infinite;
    }

    .led-line {
      position: absolute;
      height: 3px;
      width: 42px;
      border-radius: 4px;
      background: rgba(255, 70, 70, 0.9);
      box-shadow: 0 0 6px rgba(255, 55, 55, 0.45), 0 0 12px rgba(255, 35, 35, 0.3);
      pointer-events: none;
      z-index: 2;
      opacity: 0.8;
      transform-origin: center;
    }

    .login-container::before {
      content: "";
      position: absolute;
      inset: -110% auto auto -30%;
      width: 150%;
      height: 210%;
      background: linear-gradient(115deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.02) 48%, rgba(255, 255, 255, 0.2) 100%);
      transform: rotate(20deg);
      animation: glossSweep 6s linear infinite;
      pointer-events: none;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 3px;
      color: #ff4a4a;
      font-size: 28px;
      position: relative;
      z-index: 1;
    }

    .logo-section {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% - 180px));
      z-index: 10;
    }

    .logo-section img {
      max-width: 200px;
      height: auto;
      filter: drop-shadow(0 0 8px rgba(255, 70, 70, 0.7)) drop-shadow(0 0 16px rgba(255, 35, 35, 0.4));
      transition: filter 0.3s ease;
    }

    .logo-section img:hover {
      filter: drop-shadow(0 0 12px rgba(255, 100, 100, 0.9)) drop-shadow(0 0 24px rgba(255, 50, 50, 0.6));
    }

    .input-group {
      margin-bottom: 22px;
      position: relative;
      z-index: 1;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      border-bottom: 2px solid rgba(255, 30, 30, 0.9);
      background: transparent;
      box-shadow: 0 8px 14px -12px rgba(255, 0, 0, 0.95);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .input-wrap:focus-within {
      border-color: rgba(255, 75, 75, 1);
      box-shadow: 0 8px 16px -12px rgba(255, 35, 35, 1), 0 10px 24px -18px rgba(255, 0, 0, 0.9);
    }

    .input-icon {
      color: rgba(170, 170, 170, 0.9);
      font-size: 17px;
      line-height: 1;
      min-width: 16px;
    }

    .input-group input {
      width: 100%;
      padding: 3px 2px;
      border-radius: 0;
      border: none;
      outline: none;
      background: transparent !important;
      color: white;
      font-family: inherit;
      font-size: 15px;
    }

    .input-group input::placeholder {
      color: rgba(255, 182, 182, 0.62);
    }

    button {
      position: relative;
      z-index: 1;
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, #ff0f0f, #ff4b4b);
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(255, 26, 26, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(255, 23, 23, 0.72);
    }

    @keyframes floatCard {

      0%,
      100% {
        transform: translate(-50%, -50%);
      }

      50% {
        transform: translate(-50%, calc(-50% - 6px));
      }
    }

    @keyframes glossSweep {
      0% {
        transform: translateX(-28%) rotate(20deg);
        opacity: 0.08;
      }

      35% {
        opacity: 0.18;
      }

      100% {
        transform: translateX(30%) rotate(20deg);
        opacity: 0.06;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .swal2-popup {
      background: #0e0608 !important;
      color: #fff !important;
      border: 1px solid rgba(255, 70, 70, 0.4) !important;
    }

    .swal2-title {
      color: #fff !important;
    }

    .swal2-confirm {
      background: linear-gradient(90deg, #ff0f0f, #ff4b4b) !important;
    }
  </style>
</head>

<body>

  <div class="logo-section">
    <img src="client_logo.png" alt="Client Logo">
  </div>

  <div class="login-container" id="box">
    <div class="led-line" id="led"></div>

    <h2>CLIENT LOG IN</h2>

    <!-- ONLY CHANGE: FORM -->
    <form id="loginForm">
      <div class="input-group">
        <div class="input-wrap">
          <span class="input-icon">⊙</span>
          <input type="text" name="username" placeholder="Username" required>
        </div>
      </div>

      <div class="input-group">
        <div class="input-wrap">
          <span class="input-icon">◆</span>
          <input type="password" name="password" placeholder="Password" required>
        </div>
      </div>

      <button type="submit">ACCESS</button>
    </form>
  </div>
  <script>
    // FRONTEND & BACKEND INTEGRATION
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(this);
      const username = formData.get('username').trim();

      if (!username) {
        Swal.fire({ icon: 'warning', title: 'Input Required', text: 'Please enter your username.' });
        return;
      }

      try {
        const response = await fetch('api_login.php', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        if (data.success) {
          let msg = `Welcome back, ${data.user.name}!\nBalance: ₱${data.user.balance}`;
          if (data.user.has_active_session) {
            msg += `\nActive Session at ${data.user.session_info.pc_number} since ${data.user.session_info.start_time}`;
          } else {
            msg += `\nNo active session (Tap RFID card on Arduino to start).`;
          }

          Swal.fire({
            icon: 'success',
            title: 'Access Granted',
            text: msg,
            confirmButtonText: 'Enter Portal'
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Access Denied',
            text: data.message
          });
        }
      } catch (err) {
        console.error(err);
        Swal.fire({
          icon: 'error',
          title: 'Server Error',
          text: 'Could not connect to the backend.'
        });
      }
    });

    // YOUR LED ANIMATION (UNCHANGED)
    const box = document.getElementById("box");
    const led = document.getElementById("led");

    let perimeter = 0;

    function animateLed() {
      const rect = box.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      perimeter += 1.6;

      const total = 2 * (width + height);
      const p = perimeter % total;

      let x = 0;
      let y = 0;
      let rotation = 0;

      if (p < width) { x = p; y = 0; rotation = 0; } else if (p < width + height) { x = width; y = p - width; rotation = 90; } else if
        (p < 2 * width + height) { x = width - (p - (width + height)); y = height; rotation = 180; } else {
          x = 0; y = height - (p -
            (2 * width + height)); rotation = 270;
      } led.style.left = `${x - 21}px`; led.style.top = `${y - 1.5}px`;
      led.style.transform = `rotate(${rotation}deg)`; requestAnimationFrame(animateLed);
    } animateLed(); </script>

</body>

</html>
