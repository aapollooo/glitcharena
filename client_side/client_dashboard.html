<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Client Portal - Dashboard</title>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: url('Gaming Background .png') center/cover no-repeat;
            background-attachment: fixed;
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            background-color: #050102;
            /* Fallback */
        }

        /* Glassmorphism Panel styles */
        .glass-panel {
            background: linear-gradient(145deg, rgba(30, 8, 14, 0.85), rgba(12, 4, 6, 0.95));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 60, 60, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 30, 30, 0.15);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 4rem;
            border-bottom: 1px solid rgba(255, 50, 50, 0.25);
            background: rgba(10, 2, 4, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(255, 0, 0, 0.1);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-brand img {
            height: 38px;
            filter: drop-shadow(0 0 8px rgba(255, 50, 50, 0.8));
        }

        .nav-brand span {
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffb3b3;
            font-size: 16px;
            text-transform: uppercase;
        }

        .nav-actions button {
            background: transparent;
            border: 1px solid rgba(255, 60, 60, 0.5);
            color: #ff5555;
            padding: 10px 24px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-actions button:hover {
            background: rgba(255, 40, 40, 0.15);
            box-shadow: 0 0 20px rgba(255, 40, 40, 0.4);
            color: #fff;
            transform: translateY(-2px);
        }

        /* Main Welcome Section */
        .welcome-section {
            max-width: 1200px;
            margin: 3rem auto 1rem;
            padding: 0 1.5rem;
            animation: slideInDown 0.6s ease-out forwards;
        }

        .welcome-section h1 {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 50, 50, 0.5);
            margin-bottom: 8px;
        }

        .welcome-section p {
            color: rgba(255, 180, 180, 0.8);
            letter-spacing: 1px;
            font-size: 14px;
        }

        /* Dashboard Grid */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto 3rem;
            padding: 1rem 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
        }

        /* Card Elements */
        .card {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 100, 100, 0.6);
            box-shadow: 0 25px 45px rgba(200, 0, 0, 0.25), inset 0 0 0 1px rgba(255, 70, 70, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 100, 100, 0.2);
            position: relative;
        }

        .card-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 50px;
            height: 2px;
            background: #ff4a4a;
            box-shadow: 0 0 10px #ff4a4a;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: rgba(255, 200, 200, 0.9);
            text-transform: uppercase;
        }

        .card-icon {
            font-size: 22px;
            color: #ff4a4a;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        /* Values and Stats */
        .stat-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-label {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: rgba(255, 150, 150, 0.7);
            text-transform: uppercase;
        }

        .highlight-value {
            font-size: 44px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff, #ff9999);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            line-height: 1.1;
            filter: drop-shadow(0 4px 8px rgba(255, 0, 0, 0.2));
        }

        .currency-symbol {
            font-size: 24px;
            color: #ff4a4a;
            vertical-align: super;
            margin-right: 4px;
        }

        /* Session Specifics */
        .session-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 50, 50, 0.2);
            border-radius: 10px;
            padding: 16px;
        }

        .session-info-item h4 {
            font-size: 10px;
            color: rgba(255, 150, 150, 0.8);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .session-info-item p {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
            align-self: flex-start;
            margin-bottom: 10px;
        }

        .status-badge.active {
            background: rgba(0, 255, 120, 0.1);
            border: 1px solid rgba(0, 255, 120, 0.3);
            color: #4aff8b;
            box-shadow: 0 0 15px rgba(0, 255, 120, 0.15);
        }

        .status-badge.inactive {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.3);
            color: #ff4a4a;
            box-shadow: 0 0 15px rgba(255, 50, 50, 0.15);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status-badge.active .status-dot {
            background: #4aff8b;
            box-shadow: 0 0 12px #4aff8b;
            animation: pulse-green 2s infinite;
        }

        .status-badge.inactive .status-dot {
            background: #ff4a4a;
            box-shadow: 0 0 12px #ff4a4a;
        }

        /* Quick Actions grid */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .action-btn {
            background: linear-gradient(145deg, rgba(30, 5, 10, 0.6), rgba(15, 2, 5, 0.9));
            border: 1px solid rgba(255, 60, 60, 0.3);
            padding: 24px 16px;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .action-btn:hover {
            border-color: #ff4a4a;
            box-shadow: 0 10px 30px rgba(255, 20, 20, 0.3);
            transform: translateY(-4px);
        }

        .action-btn:hover::before {
            opacity: 1;
        }

        .action-icon {
            font-size: 28px;
            color: #ff6b6b;
            text-shadow: 0 0 10px rgba(255, 50, 50, 0.5);
            transition: transform 0.3s ease;
        }

        .action-btn:hover .action-icon {
            transform: scale(1.1);
            color: #ff8585;
        }

        .action-text {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffd6d6;
        }

        /* Animations */
        @keyframes pulse-green {
            0% {
                box-shadow: 0 0 0 0 rgba(74, 255, 139, 0.5);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(74, 255, 139, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(74, 255, 139, 0);
            }
        }

        @keyframes slideInDown {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 860px) {
            nav {
                padding: 1rem 1.5rem;
            }

            .nav-brand span {
                display: none;
            }

            .welcome-section h1 {
                font-size: 28px;
            }

            .dashboard-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        /* Sweet Alert override for Dashboard */
        .swal2-popup {
            background: #0e0608 !important;
            color: #fff !important;
            border: 1px solid rgba(255, 70, 70, 0.4) !important;
            font-family: 'Orbitron', sans-serif !important;
        }

        .swal2-title {
            color: #fff !important;
        }

        .swal2-confirm {
            background: linear-gradient(90deg, #ff0f0f, #ff4b4b) !important;
            font-family: 'Orbitron', sans-serif !important;
            border-radius: 6px !important;
        }

        .swal2-cancel {
            background: transparent !important;
            border: 1px solid #ff4a4a !important;
            color: #ff4a4a !important;
            font-family: 'Orbitron', sans-serif !important;
            border-radius: 6px !important;
        }
    </style>
</head>

<body>

    <!-- Top Navigation -->
    <nav>
        <div class="nav-brand">
            <img src="client_logo.png" alt="Client Logo"
                onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\' fill=\'%23ff4a4a\'><path d=\'M50 0L90 20v60L50 100L10 80V20z\'/></svg>'">
            <span>Client Portal</span>
        </div>
        <div class="nav-actions">
            <!-- Connect this to logout script -->
            <button onclick="logout()">
                <span>LOGOUT</span>
                <span style="font-size: 16px;">⏻</span>
            </button>
        </div>
    </nav>

    <!-- Welcome Section -->
    <section class="welcome-section">
        <h1 id="welcomeName">Welcome, User</h1>
        <p>Your portal to the digital frontier.</p>
    </section>

    <!-- Dashboard Grid -->
    <div class="dashboard-container">

        <!-- Balance Card -->
        <div class="card glass-panel">
            <div class="card-header">
                <span class="card-title">Account Balance</span>
                <span class="card-icon">₱</span>
            </div>
            <div class="stat-wrap" style="flex-grow: 1; justify-content: center;">
                <span class="stat-label">Available Funds</span>
                <div>
                    <span class="currency-symbol">₱</span>
                    <span class="highlight-value" id="userBalance">0.00</span>
                </div>
            </div>
        </div>

        <!-- Session Status Card -->
        <div class="card glass-panel" style="grid-column: span auto;">
            <div class="card-header">
                <span class="card-title">Session Monitor</span>
                <span class="card-icon">⚡</span>
            </div>

            <div id="sessionStatusContainer">
                <!-- Toggle between active/inactive via JS -->
                <div class="status-badge inactive" id="sessionBadge">
                    <div class="status-dot"></div>
                    <span id="sessionStatusText">No Active Session</span>
                </div>
            </div>

            <div class="session-info-grid">
                <div class="session-info-item">
                    <h4>PC NUMBER</h4>
                    <p id="pcNumber">-</p>
                </div>
                <div class="session-info-item">
                    <h4>START TIME</h4>
                    <p id="startTime">-</p>
                </div>
                <div class="session-info-item">
                    <h4>DURATION</h4>
                    <p id="duration">-</p>
                </div>
                <div class="session-info-item">
                    <h4>TOTAL COST</h4>
                    <p id="totalCost">₱ 0.00</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions Card -->
        <div class="card glass-panel">
            <div class="card-header">
                <span class="card-title">Quick Actions</span>
                <span class="card-icon">⬡</span>
            </div>
            <div class="quick-actions">
                <button class="action-btn" onclick="showTopUpInfo()">
                    <span class="action-icon">⇪</span>
                    <span class="action-text">TOP UP</span>
                </button>
                <button class="action-btn" onclick="showHistory()">
                    <span class="action-icon">⏱</span>
                    <span class="action-text">HISTORY</span>
                </button>
            </div>
        </div>

    </div>

    <!-- Frontend logic for the client dashboard -->
    <script>
        // Function to populate the Dashboard
        function initializeDashboard(data) {
            document.getElementById('welcomeName').textContent = `Welcome, ${data.name}`;
            document.getElementById('userBalance').textContent = data.balance;

            const badge = document.getElementById('sessionBadge');
            const statusText = document.getElementById('sessionStatusText');

            if (data.has_active_session) {
                badge.className = 'status-badge active';
                statusText.textContent = 'Active Session';

                document.getElementById('pcNumber').textContent = data.session_info.pc_number;
                document.getElementById('startTime').textContent = data.session_info.start_time;
                document.getElementById('duration').textContent = data.session_info.duration;
                document.getElementById('totalCost').textContent = `₱ ${data.session_info.cost}`;
            } else {
                badge.className = 'status-badge inactive';
                statusText.textContent = 'No Active Session';

                document.getElementById('pcNumber').textContent = '-';
                document.getElementById('startTime').textContent = '-';
                document.getElementById('duration').textContent = '-';
                document.getElementById('totalCost').textContent = '₱ 0.00';
            }
        }

        // Initialize with data on load
        window.onload = async () => {
            try {
                const response = await fetch('api_get_user_info.php');
                const data = await response.json();

                if (data.success) {
                    initializeDashboard(data);
                } else {
                    Swal.fire({
                        title: 'Dashboard Error',
                        text: data.message || 'You are not logged in or your session has expired.',
                        icon: 'error',
                        confirmButtonText: 'Return to Login'
                    }).then(() => {
                        window.location.href = "log_in.html";
                    });
                }
            } catch (error) {
                console.error("Failed to fetch dashboard data:", error);
                Swal.fire({
                    title: 'System Error',
                    text: 'Unable to retrieve dashboard information.',
                    icon: 'error'
                });
            }
        };

        // UI Interactions
        function showTopUpInfo() {
            Swal.fire({
                title: 'Top Up Account',
                text: 'Please approach the front desk or use the self-service kiosk to reload your account balance.',
                icon: 'info',
                confirmButtonText: 'Understood'
            });
        }

        function showHistory() {
            Swal.fire({
                title: 'Session History',
                text: 'Detailed session history feature is currently under development.',
                icon: 'info',
                confirmButtonText: 'Close'
            });
        }

        function logout() {
            Swal.fire({
                title: 'Disconnect?',
                text: "Are you sure you want to log out?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, Logout',
                cancelButtonText: 'Cancel'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        await fetch('api_logout.php');
                        window.location.href = "log_in.html";
                    } catch (e) {
                        window.location.href = "log_in.html";
                    }
                }
            });
        }
    </script>
</body>

</html>
